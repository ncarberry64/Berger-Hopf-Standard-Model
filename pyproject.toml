[project]
name = "berger-hopf-sm-completion"
version = "0.1.0"
description = "Berger-Hopf geometric physics: conditional models, reproducible evidence and completion audits."
readme = "README.md"
authors = [{name = "Norman P. Carberry"}]
license = {file = "LICENSE.md"}
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "sympy",
  "mpmath",
  "pytest",
]

[project.urls]
Repository = "https://github.com/ncarberry64/Berger-Hopf-Standard-Model"
Documentation = "https://github.com/ncarberry64/Berger-Hopf-Standard-Model/blob/main/docs/INSTITUTIONAL_START.md"
Museum = "https://ncarberry64.github.io/Berger-Hopf-Standard-Model/"
Issues = "https://github.com/ncarberry64/Berger-Hopf-Standard-Model/issues"

[project.optional-dependencies]
benchmark = [
  "matplotlib",
  "pillow",
]
rigorous = [
  "python-flint==0.9.0",
]
acceleration = [
  "jax==0.11.1",
  "jaxlib==0.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
