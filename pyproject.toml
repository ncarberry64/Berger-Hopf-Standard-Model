[project]
name = "berger-hopf-sm-completion"
version = "0.1.0"
description = "Conditional Berger-Hopf Standard Model completion screens and audits."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "sympy",
  "pytest",
]

[project.optional-dependencies]
benchmark = [
  "matplotlib",
  "pillow",
]
rigorous = [
  "python-flint==0.9.0",
]
acceleration = [
  "jax==0.11.1",
  "jaxlib==0.11.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
