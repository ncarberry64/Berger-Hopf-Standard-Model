name: BHSM core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_historical_regression:
        description: Run the retained full pytest corpus
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  signed-midpoint-completeness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact arithmetic and test dependencies
        run: python -m pip install -e ".[rigorous]"
      - name: Check signed midpoint chain rule and retained diagnostics
        run: >-
          python -m pytest -q
          tests/test_n12_gate7_current_green_signed_transverse_causal_center.py
          tests/test_n12_gate7_signed_midpoint_completeness_audit.py
          tests/test_current_green_supplemental_midpoint.py
          tests/test_n12_gate7_current_green_supplemental_midpoint_blocks.py
          tests/test_n12_gate7_current_green_supplemental_midpoint_blocks_certificate.py
          tests/test_n12_gate7_current_green_supplemental_mixed_rate.py
          tests/test_n12_gate7_current_green_supplemental_mixed_rate_validation.py
          tests/test_n12_gate7_current_green_supplemental_compute_justification.py
          tests/test_n12_gate7_current_green_supplemental_basis_inverse.py
          tests/test_n12_gate7_current_green_midpoint_coordinate_solve.py
          tests/test_current_green_midpoint_coordinate_error.py
          tests/test_n12_gate7_current_green_midpoint_coordinate_pullback.py
          tests/test_symmetric_quadratic_center.py
          tests/test_n12_gate7_symmetric_quadratic_representatives.py
          tests/test_current_green_scalar_covector_correction.py
          tests/test_current_green_stored_tensor_error.py
          tests/test_current_green_causal_error.py
          tests/test_scalar_updated_quadratic_representation.py
          tests/test_nonnegative_two_radius_screen.py
          tests/test_n12_gate7_signed_center_continuous_radii.py
          tests/test_resolved_midpoint_coordinate_error.py
          tests/test_n12_gate7_resolved_coordinate_causal_transport.py
          tests/test_frozen_causal_map_error.py
          tests/test_n12_gate7_frozen_causal_map_construction.py
          tests/test_frozen_output_map_error.py
          tests/test_n12_gate7_frozen_output_map_construction.py
          tests/test_stored_pullback_assembly_error.py
          tests/test_n12_gate7_stored_pullback_assembly.py
          tests/test_stored_covariance_enclosure.py
          tests/test_signed_covariance_causal_bounds.py
          tests/test_n12_gate7_stored_covariance_formation.py
          tests/test_n12_gate7_signed_covariance_causal_recomposition.py
          tests/test_stored_causal_arithmetic_envelope.py
          tests/test_sparse_arb_mixed_jets.py
          tests/test_prescribed_arb_action_jet.py
          tests/test_batched_mixed_physical_graph.py
          tests/test_physical_hessian_error_pullback.py
          tests/test_physical_hessian_row_cache.py
          tests/test_stored_midpoint_kinematic_error.py
          tests/test_selected_physical_hessian_pullbacks.py
          tests/test_n12_gate7_stored_causal_arithmetic_envelope.py

  core-scientific-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[benchmark]"
      - name: Focused cross-resolution and invariant tests
        run: >-
          python -m pytest -q
          tests/test_ae3_c2_photon_symbol_audit.py
          tests/test_ae32_c2_einstein_cartan_lr_action.py
          tests/test_ae31_c2_state_observable_audit.py
          tests/test_bhsm_museum_residual_data.py
          tests/test_bhsm_museum_facade.py
          tests/test_museum_science_collection.py
          tests/test_retained_research_artifact_hygiene.py
          tests/test_bhsm_n16_coupled_momentum_response.py
          tests/test_bhsm_n12_direct_checkpoint.py
          tests/test_bhsm_n12_full_qvm_constraint_tail.py
          tests/test_bhsm_n12_continuum_source_compatibility_checkpoint.py
          tests/test_bhsm_n12_dynamic_calderon_checkpoint.py
          tests/test_bhsm_n12_source_restricted_positive_duration.py
          tests/test_bhsm_n12_calderon_root_enclosure.py
          tests/test_bhsm_n12_continuum_majorant_checkpoint.py
          tests/test_bhsm_n12_action_graph_galerkin_projector.py
          tests/test_bhsm_n12_compact_observation_moduli.py
          tests/test_bhsm_continuum_event_child_certificate.py
          tests/test_bhsm_n12_matched_parent_qxi_ownership.py
          tests/test_bhsm_n12_matched_parent_stationary_section.py
          tests/test_bhsm_qxi_relative_energy_reuse_table.py
          tests/test_bhsm_post_parent_flagship_observable_chain.py
          tests/test_n12_singular_event_temporal_chirality.py
          tests/test_n12_continuum_singular_hitting_reset_relation.py
          tests/test_n12_forward_time_domain_orientation.py
          tests/test_n12_forward_time_temporal_chirality_audit.py
          tests/test_bhsm_n12_intrinsic_state_return_section.py
          tests/test_n12_forward_invariant_history_existence.py
          tests/test_n12_forward_terminal_chart_reachability.py
          tests/test_n12_gate7_localization_carrier_kill_screen.py
          tests/test_n12_gate7_physical_encapsulation_identification.py
          tests/test_n12_gate7_final_start_condition.py
          tests/test_covariant_bubble_interface_mechanics.py
          tests/test_covariant_interface_seam_selection.py
          tests/test_fsc_encapsulation_constitutive_adjudication.py
          tests/test_post_ae2_localization_carrier_extension_contract.py
          tests/test_bhsm_aether_cross_resolution_reconnaissance_v21_35.py
          tests/test_bhsm_n6_n12_nonlinear_homotopy_integrability_v21_36.py
          tests/test_bhsm_n6_n12_fixed_chart_rank_no_go_v21_37.py
          tests/test_engine_invariant_preservation.py
          tests/test_engine_physics_status_separation.py
      - name: Public status and claim boundaries
        run: |
          python scripts/audit_covariant_bubble_interface_mechanics.py
          python tools/audit_forbidden_claims.py
          python tools/audit_bhsm_status.py
          python tools/audit_frozen_prediction_integrity.py
          python tools/audit_public_readiness.py
          python tools/materialize_museum_science.py --check
          python tools/verify_precision.py
      - name: Coordinate benchmark precision gate
        run: |
          python -m bhsm.interface.benchmarks.coordinate_benchmark \
            --events 100000 \
            --boundary-fraction 0.35 \
            --repeats 1 \
            --output tmp/ci-coordinate-benchmark/results.json \
            --markdown tmp/ci-coordinate-benchmark/results.md \
            --plot tmp/ci-coordinate-benchmark/latency.png \
            --summary
          python tools/verify_precision.py \
            --results tmp/ci-coordinate-benchmark/results.json
      - name: Patch hygiene
        run: git diff --check

  root-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: rootproject/root@sha256:9d2a9dd6991dc3571eeb8a33b0eb313cfd785eb3303b14ce0170b09a44c2ecb7
    steps:
      - uses: actions/checkout@v4
      - name: Report ROOT toolchain
        run: |
          root-config --version
          cmake --version
      - name: Configure generic-safe ROOT integration
        run: >-
          cmake -S . -B build
          -DBUILD_ROOT_INTEGRATION=ON
          -DENABLE_AVX2=OFF
          -DENABLE_AVX512=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Compile ROOT integration
        run: cmake --build build --config Release --parallel 2
      - name: Run live ROOT integration smoke test
        run: ctest --test-dir build --build-config Release --output-on-failure

  full-historical-regression:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.full_historical_regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[benchmark]"
      - name: Retained full historical pytest corpus
        run: python -m pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Upload historical test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-pytest-results
          path: artifacts/pytest-results.xml
