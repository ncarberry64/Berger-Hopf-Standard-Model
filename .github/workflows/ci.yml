name: BHSM core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_historical_regression:
        description: Run the retained full pytest corpus
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  core-scientific-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[benchmark]"
      - name: Focused cross-resolution and invariant tests
        run: >-
          python -m pytest -q
          tests/test_bhsm_aether_cross_resolution_reconnaissance_v21_35.py
          tests/test_bhsm_n6_n12_nonlinear_homotopy_integrability_v21_36.py
          tests/test_engine_invariant_preservation.py
          tests/test_engine_physics_status_separation.py
      - name: Public status and claim boundaries
        run: |
          python tools/audit_forbidden_claims.py
          python tools/audit_bhsm_status.py
          python tools/audit_frozen_prediction_integrity.py
          python tools/verify_precision.py
      - name: Patch hygiene
        run: git diff --check

  full-historical-regression:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.full_historical_regression
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[benchmark]"
      - name: Retained full historical pytest corpus
        run: python -m pytest -q --junitxml=artifacts/pytest-results.xml
      - name: Upload historical test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-pytest-results
          path: artifacts/pytest-results.xml
