name: Formal Blackhole Tracker
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracker-source-and-wheel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify formal source bytes
        run: python tools/verify_blackhole_tracker_snapshot.py
      - name: Install product test and build dependencies
        working-directory: products/blackhole_tracker
        run: python -m pip install -e ".[dev,astrometry,joint-research]"
      - name: Product contracts, browser fixture and replay
        working-directory: products/blackhole_tracker
        run: python -m pytest -q tests
      - name: Replay deterministic research controls without observations
        working-directory: products/blackhole_tracker
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys
          subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "research/known2023_student_20261024", "-p", "test*.py", "-v"], check=True)
          output = Path(os.environ["RUNNER_TEMP"]) / "tracker-ideal-algebra-replay"
          subprocess.run([sys.executable, "research/bhsm_claim_20261024/replay_ideal_controls.py", "--output", str(output)], check=True)
      - name: Build installable wheel
        working-directory: products/blackhole_tracker
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Fit and export replay from wheel outside checkout
        run: python tools/smoke_blackhole_tracker_wheel.py --wheel products/blackhole_tracker/dist/bhsm_blackhole_tracker-0.2.0rc7-py3-none-any.whl
      - name: Optional joint route from an isolated astrometry wheel installation
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys, tempfile, venv
          workspace = Path.cwd()
          wheels = list((workspace / "products/blackhole_tracker/dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit("Expected exactly one freshly built tracker wheel")
          probe = workspace / "products/blackhole_tracker/scripts/probe_joint_install.py"
          output = workspace / "tracker-artifacts/joint-wheel-smoke.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          for name in ("PYTHONPATH", "PYTHONHOME"):
              environment.pop(name, None)
          environment.update(PYTHONNOUSERSITE="1", MPLBACKEND="Agg", OPENBLAS_NUM_THREADS="1", OMP_NUM_THREADS="1")
          with tempfile.TemporaryDirectory(prefix="bhsm optional joint wheel ") as directory:
              outside = Path(directory)
              venv.EnvBuilder(with_pip=True).create(outside / "venv")
              python = outside / "venv" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
              subprocess.run([str(python), "-I", "-m", "pip", "install", str(wheels[0]) + "[astrometry]"], cwd=outside, env=environment, check=True, timeout=600)
              subprocess.run([str(python), "-I", str(probe), "--output", str(output)], cwd=outside, env=environment, check=True, timeout=600)
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-tracker-wheel-${{ matrix.os }}
          path: |
            products/blackhole_tracker/dist/*.whl
            tracker-artifacts/joint-wheel-smoke.json

  tracker-known-wheel:
    needs: tracker-source-and-wheel
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: blackhole-tracker-wheel-${{ matrix.os }}
          path: tracker-wheel-input
      - name: Test the Gaussian research engine from the wheel outside the checkout
        shell: python
        run: |
          from pathlib import Path
          import json, os, shutil, subprocess, sys, tempfile, venv
          workspace = Path.cwd()
          wheels = list((workspace / 'tracker-wheel-input').rglob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('Expected one wheel from the source-and-wheel job')
          tests = workspace / 'products/blackhole_tracker/tests'
          report = workspace / 'tracker-artifacts/known-wheel-tests.xml'
          report.parent.mkdir(parents=True, exist_ok=True)
          environment = os.environ.copy()
          for name in ('PYTHONPATH', 'PYTHONHOME'):
              environment.pop(name, None)
          environment.update(PYTHONNOUSERSITE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1',
                             MPLBACKEND='Agg', OPENBLAS_NUM_THREADS='1', OMP_NUM_THREADS='1')
          with tempfile.TemporaryDirectory(prefix='bhsm known wheel ') as directory:
              outside = Path(directory)
              fixture_root = outside / 'fixture-source'
              copied_tests = fixture_root / 'tests'
              copied_tests.mkdir(parents=True)
              for name in ('test_known_system_v3.py', 'test_known_system_cli.py'):
                  shutil.copy2(tests / name, copied_tests / name)
              shutil.copytree(tests / 'known_system_v3_reference', copied_tests / 'known_system_v3_reference')
              shutil.copy2(tests.parent / 'pyproject.toml', fixture_root / 'pyproject.toml')
              origins = report.with_name('known-wheel-origins.json')
              (fixture_root / 'conftest.py').write_text(
                  'from pathlib import Path\n'
                  'import json, sys\n'
                  'def pytest_sessionstart(session):\n'
                  '    import bhtracker\n'
                  '    from bhtracker import known_system_v3\n'
                  '    prefix = Path(sys.prefix).resolve()\n'
                  '    package = Path(bhtracker.__file__).resolve()\n'
                  '    engine = Path(known_system_v3.__file__).resolve()\n'
                  '    assert package.is_relative_to(prefix) and engine.is_relative_to(prefix)\n'
                  '    record = {"passed": True, "package": str(package), "engine": str(engine), "prefix": str(prefix), "isolated": bool(sys.flags.isolated)}\n'
                  f'    Path({str(origins)!r}).write_text(json.dumps(record, indent=2) + "\\n", encoding="utf-8")\n',
                  encoding='utf-8')
              venv.EnvBuilder(with_pip=True).create(outside / 'venv')
              python = outside / 'venv' / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
              subprocess.run([str(python), '-I', '-m', 'pip', 'install',
                              str(wheels[0]) + '[joint-research]', 'pytest>=8'],
                             cwd=outside, env=environment, check=True, timeout=600)
              subprocess.run([str(python), '-I', '-c',
                              'from pathlib import Path; import sys, bhtracker; '
                              'from bhtracker.known_system_v3 import availability; '
                              'assert Path(bhtracker.__file__).resolve().is_relative_to(Path(sys.prefix).resolve()); '
                              'assert availability()["available"]'],
                             cwd=outside, env=environment, check=True, timeout=60)
              subprocess.run([str(python), '-I', '-m', 'pytest', '-q',
                              str(copied_tests / 'test_known_system_v3.py'),
                              str(copied_tests / 'test_known_system_cli.py'), '--junitxml', str(report)],
                             cwd=outside, env=environment, check=True, timeout=600)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blackhole-tracker-known-wheel-${{ matrix.os }}
          path: |
            tracker-artifacts/known-wheel-tests.xml
            tracker-artifacts/known-wheel-origins.json

  tracker-paper-and-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile paper without changing reviewed PDF
        run: >-
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error
          -outdir="$RUNNER_TEMP/tracker-latex"
          papers/bhsm_blackhole_tracker_20261021/manuscript/main.tex
      - name: Verify source and build complete portable release
        run: |
          python tools/verify_blackhole_tracker_snapshot.py
          python papers/bhsm_blackhole_tracker_20261021/scripts/package_release.py tracker-artifacts
          python tools/verify_blackhole_tracker_release.py --archive tracker-artifacts/BHSM_Blackhole_Tracker_Source.zip
      - name: Reproduce theory inputs in isolated extracted source
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, subprocess, sys, zipfile
          target = Path(os.environ['RUNNER_TEMP']) / 'tracker-source-replay'
          target.mkdir()
          with zipfile.ZipFile('tracker-artifacts/BHSM_Blackhole_Tracker_Source.zip') as source:
              source.extractall(target)
          theory = target / 'products/blackhole_tracker/bhtracker/theory'
          def hashes():
              return {p.relative_to(theory).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                      for p in sorted(theory.rglob('*')) if p.is_file()}
          before = hashes()
          subprocess.run([sys.executable, str(target / 'products/blackhole_tracker/scripts/sync_theory.py')], check=True)
          after = hashes()
          if before != after:
              raise SystemExit('Source-regenerated theory bytes differ from the reviewed provider')
          receipt = {'passed': True, 'files': len(before), 'scope': 'Exact provider source regeneration, not physical confirmation'}
          Path('tracker-artifacts/provider-source-replay.json').write_text(json.dumps(receipt, indent=2) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: blackhole-tracker-paper-and-source
          path: |
            tracker-artifacts/BHSM_Blackhole_Tracker_Source.zip
            tracker-artifacts/BHSM_Blackhole_Tracker_Manuscript.pdf
            tracker-artifacts/provider-source-replay.json
            ${{ runner.temp }}/tracker-latex/main.pdf
